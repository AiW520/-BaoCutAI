<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      BaoCut 文档编辑器页面（docs/design/docs §3），照原 Docs 类型的页面改来。Runtime 在 /docs/<grant>/ 下提供并注入 <base href="/docs/<grant>/">，
      应用的路由在 /docs/<grant>/project/<文档 id>，接口与长连接的前缀由 src/main.ts 第一个导入（@baocut/docs/editor/install）设好。
      与原页面不同的地方：
      - 原页面开头的内联脚本是托管平台的健康上报（artifact.json 的 monitoring 与 __appifact_health），这里不装。
      - 不预载 Anthropic Sans（不内置品牌字体，见 packages/docs-runtime/README.md「宿主与平台」）；图标字体照原样由应用按需加载。
      - appifact-capabilities 只留 comments：应用本身不读这个 meta（它是写给托管平台看的），留下的是 BaoCut 实际提供的那一项
        ——批注由应用自己画（headless）、锚点由应用自己算（customAnchors），宿主经 globalThis.docsHost.comments 把批注交给智能体。
        去掉 user（没有登录用户）、assets（素材走文档服务自己的接口）、sample（不提供模型调用）、room（单用户）、
        downloads（不在 Frame 里，导出走浏览器下载）与 mcp（Google Drive、Notion、Claude Docs 的连接器）。
      - 不带 README 注释与 meta（写给托管平台上的 Claude 看的）；标题是 Docs 不是 Claude Docs。
      - 原页面引用打好的分块（./artifact-type/index-*.js 等）与样式表 ./artifact-type/index-7E8lmnbp.css；这里是 Vite 的入口 src/main.ts
        与逐字节相同的 /assets/docs.css（来自 packages/docs-runtime/public/，构建后是相对地址）。
      - body 开头多一段内联脚本，提前挂一个隐藏的空沙箱 iframe（sandbox="allow-scripts"，与编辑器 iframe 相同）。浏览器把沙箱 iframe
        放进单独的渲染进程，第一次要新起进程（空闲时约 0.3 秒，加载中更久）；原版在 Frame 里提前建好编辑器 iframe 来藏这段时间，
        独立页面没有这一步。提前挂上之后，应用建编辑器 iframe 时进程已经在了。编辑器发出 lfile-prelude-ready（进程已归它用）
        或 20 秒后移除。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docs</title>
    <meta name="appifact-capabilities" content="{&quot;comments&quot;:{&quot;customAnchors&quot;:true,&quot;headless&quot;:true}}" />
    <link rel="stylesheet" href="/assets/docs.css" />
  </head>
  <body>
    <script>
      // 提前起编辑器 iframe 要用的沙箱进程（见开头注释）。
      (function () {
        var warm = document.createElement('iframe');
        warm.setAttribute('sandbox', 'allow-scripts');
        warm.setAttribute('aria-hidden', 'true');
        warm.tabIndex = -1;
        warm.style.display = 'none';
        warm.srcdoc = '';
        document.body.appendChild(warm);
        var timer = setTimeout(done, 20000);
        addEventListener('message', done);
        function done(event) {
          if (event && !(event.data && event.data.type === 'lfile-prelude-ready')) return;
          removeEventListener('message', done);
          clearTimeout(timer);
          warm.remove();
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
